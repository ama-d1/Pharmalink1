spring:
  application:
    name: server

  # ── Database ──────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmalink
    username: postgres
    password: pharmalink123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000        # 20 s — fail fast if DB is unreachable
      initialization-fail-timeout: 1   # -1 to keep retrying; 1 to fail fast
      maximum-pool-size: 10
      minimum-idle: 2

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update                 # Creates/updates tables automatically
    show-sql: false                    # Set to true only when debugging queries
    open-in-view: false                # Prevents accidental lazy-load outside service layer
    properties:
      hibernate:
        format_sql: true
        # DO NOT set database-platform here — Hibernate 6 (Spring Boot 3+/4)
        # auto-detects PostgreSQL dialect. The old class
        # org.hibernate.dialect.PostgreSQLDialect was removed in Hibernate 6
        # and causes ClassNotFoundException at startup.


  # ── Mail ─────────────────────────────────────────────────────────────────────
  # Replace these placeholder values with real Gmail credentials before deploying.
  # To get an app password: Google Account → Security → 2-Step Verification → App passwords
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com     # ← REPLACE with your Gmail address
    password: your_app_password        # ← REPLACE with your 16-char Gmail App Password
    test-connection: false             # Prevents startup failure with placeholder credentials
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  address: 0.0.0.0