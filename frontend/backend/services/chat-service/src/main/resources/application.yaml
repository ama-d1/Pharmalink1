spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pharmalink_chat
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pharmalink123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      initialization-fail-timeout: 1
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate            # Phase 2 (MICROSERVICES_PLAN.md sec 6 step 9): Flyway now
                                     # owns schema creation/changes (see db/migration/V1__init.sql
                                     # and the flyway block below) -- Hibernate only validates.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---- Flyway --------------------------------------------
  # Baseline (V1__init.sql) was hand-derived from this service's @Entity classes
  # rather than pg_dump'ed from a live DB -- see the migration file's header
  # comment and MICROSERVICES_PLAN.md Phase 2 step 9 for that caveat.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ── Cross-service calls to user-profile-service ─────────────────────────────
# Pharmacist search (role+pharmacyId/name) and conversation participant name
# resolution both live in user-profile-service now — see
# MICROSERVICES_PLAN.md §6 step 5b for why (role/pharmacyId/name are spread
# across auth-service and user-profile-service, so this had to be resolved
# during this extraction, not deferred further).
services:
  user-profile:
    base-url: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}

# ── JWT (Phase 2, MICROSERVICES_PLAN.md §6 step 8) ──────────────────────────
# MUST match auth-service's/api-gateway's security.jwt.secret exactly — same
# HMAC key, same env var name (JWT_SECRET) so it stays in sync across
# environments. This service only ever verifies (never issues) tokens, and
# only at the STOMP CONNECT frame — see StompAuthChannelInterceptor. REST
# endpoints under /api/chat/** still rely on the gateway having already
# validated the token and forwarded X-User-Id/X-User-Role/X-User-Email.
security:
  jwt:
    secret: ${JWT_SECRET:pharmalink_super_secret_key_2026_change_me_in_prod_min_32_chars}

server:
  port: 8087
  address: 0.0.0.0
