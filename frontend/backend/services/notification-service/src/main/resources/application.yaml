spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pharmalink_notifications
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pharmalink123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      initialization-fail-timeout: 1
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate            # Phase 2 (MICROSERVICES_PLAN.md §6 step 9): Flyway now
                                     # owns schema creation/changes (see db/migration/V1__init.sql
                                     # and the flyway block below) — Hibernate only validates.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ─────────────────────────────────────────────────
  # Baseline (V1__init.sql) was hand-derived from this service's @Entity classes
  # rather than pg_dump'ed from a live DB — see the migration file's header
  # comment and MICROSERVICES_PLAN.md Phase 2 step 9 for that caveat.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Mail (coming-soon roadmap item #6) ──────────────────────────────────
  # Same Gmail SMTP config and shared MAIL_USERNAME/MAIL_PASSWORD env vars
  # as auth-service's password-reset emails (see that service's
  # application.yaml/EmailService) — one Gmail account, one App Password,
  # reused across both services rather than needing two separate mail
  # setups. Only ORDER_STATUS/APPOINTMENT_REMINDER notifications ever
  # trigger an email — see NotificationService's javadoc.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}     # ← REPLACE with real Gmail address
    password: ${MAIL_PASSWORD:your_app_password}        # ← REPLACE with real Gmail App Password
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── user-profile-service ─────────────────────────────────────────────────
# EmailService checks Profile.emailNotifications (and gets the user's
# email) before sending — see ProfileClient.
services:
  user-profile:
    base-url: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}

server:
  port: 8089
  address: 0.0.0.0
